name: Deploy Kubespray Cluster

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          git clone https://github.com/kubernetes-sigs/kubespray.git
          cd kubespray
          git checkout v2.26.0
          pip install -r requirements.txt

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_PUBLIC_IPS }} >> ~/.ssh/known_hosts

      - name: Generate inventory
        id: inventory
        run: |
          pip install ruamel.yaml netaddr
          cd kubespray
          cp -rfp inventory/sample inventory/k8s
          declare -a IPS=(${{ secrets.VM_IPS }})
          CONFIG_FILE=inventory/k8s/hosts.yaml python3 contrib/inventory_builder/inventory.py "${IPS[@]}"
          cat inventory/k8s/hosts.yaml
          echo "inventory=inventory/k8s/hosts.yaml" >> $GITHUB_OUTPUT

      - name: Configure addons
        run: |
          cd kubespray
          sed -i 's/helm_enabled: false/helm_enabled: true/' inventory/k8s/group_vars/k8s_cluster/addons.yml
          sed -i 's/ingress_nginx_enabled: false/ingress_nginx_enabled: true/' inventory/k8s/group_vars/k8s_cluster/addons.yml
          sed -i 's/ingress_nginx_host_network: false/ingress_nginx_host_network: true/' inventory/k8s/group_vars/k8s_cluster/addons.yml
          echo "remote_user=root" >> ansible.cfg

      - name: Deploy cluster
        run: |
          cd kubespray
          ansible-playbook -i ${{ steps.inventory.outputs.inventory }} \
            --private-key ~/.ssh/id_rsa \
            --user ${{ secrets.ANSIBLE_USER }} \
            --become --become-user=root \
            cluster.yml

      - name: Verify cluster
        run: |
          cd kubespray
          MASTER_IP=$(echo ${{ secrets.VM_PUBLIC_IPS }} | cut -d' ' -f1)
          scp root@${MASTER_IP}:/root/.kube/config .kubeconfig
          chmod 600 .kubeconfig
          export KUBECONFIG=.kubeconfig
          kubectl get nodes -o wide
          kubectl get pods -n kube-system