name: Deploy Kubespray Cluster

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install ansible==7.6.0 netaddr jinja2
          git clone https://github.com/kubernetes-sigs/kubespray.git
          cd kubespray
          git checkout v2.19.0
          pip install -r requirements.txt

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_PUBLIC_IPS }} >> ~/.ssh/known_hosts

      - name: Generate inventory from template
        run: |
          cd kubespray
          cp -r ${{ github.workspace }}/kubespray-config/* inventory/k8s/

          python3 -c "
            import yaml, jinja2, os
            template = jinja2.Template(open('inventory/k8s/hosts-template.yaml.j2').read())
            data = {
                'nodes': ['node1','node2'],
                'public_ips': os.environ['VM_PUBLIC_IPS'].split(),
                'private_ips': os.environ['VM_PRIVATE_IPS'].split(),
                'control_plane_nodes': ['node1','node2'],
                'all_nodes': ['node1','node2'],
                'etcd_nodes': ['node1','node2']
            }
            with open('inventory/k8s/hosts.yaml', 'w') as f:
                f.write(template.render(**data))
          "
        env:
          VM_PUBLIC_IPS: ${{ secrets.VM_PUBLIC_IPS }}
          VM_PRIVATE_IPS: ${{ secrets.VM_PRIVATE_IPS }}

      - name: Configure addons
        run: |
          cd kubespray
          sed -i 's/helm_enabled: false/helm_enabled: true/' inventory/k8s/group_vars/k8s_cluster/addons.yml
          sed -i 's/ingress_nginx_enabled: false/ingress_nginx_enabled: true/' inventory/k8s/group_vars/k8s_cluster/addons.yml
          sed -i 's/ingress_nginx_host_network: false/ingress_nginx_host_network: true/' inventory/k8s/group_vars/k8s_cluster/addons.yml
          echo "remote_user=root" >> ansible.cfg

      - name: Deploy cluster
        run: |
          cd kubespray
          ansible-playbook -i ${{ steps.inventory.outputs.inventory }} \
            --private-key ~/.ssh/id_rsa \
            --user ${{ secrets.ANSIBLE_USER }} \
            cluster.yml

      - name: Verify cluster
        run: |
          cd kubespray
          MASTER_IP=$(echo ${{ secrets.VM_PUBLIC_IPS }} | cut -d' ' -f1)
          scp root@${MASTER_IP}:/root/.kube/config .kubeconfig
          chmod 600 .kubeconfig
          export KUBECONFIG=.kubeconfig
          kubectl get nodes -o wide
          kubectl get pods -n kube-system